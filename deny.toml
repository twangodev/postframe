[licenses]
# postframe is GPL-3.0-or-later, which permits LGPL dependencies.
# Grow this list as dependencies land; an unused entry is a warning.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "IJG",
    "ISC",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
ignore = [
    # egui's font stack; upstream is aware and migrating to skrifa.
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned rev until an egui release targets wgpu 30.
allow-git = ["https://github.com/emilk/egui"]
