name: Svelte

on:
  push:
    branches: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - web/**
      - .github/workflows/svelte.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-svelte
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://postframe.twango.dev
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly-2025-11-15
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2

      # wasm-pack downloads a wasm-bindgen matching the lockfile, plus wasm-opt.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
