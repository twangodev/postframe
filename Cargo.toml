[package]
name = "postframe"
description = "Exposure bracket merging with in-camera rendering recovery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/twangodev/postframe"

[[bin]]
name = "postframe"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:image"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.4", features = ["derive"], optional = true }
demosaic = "0.3.0"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
jpeg-encoder = "0.7.1"
mtb-align = "0.1.0"
rawler = "0.7.2"
thiserror = "2.0.19"
ultrahdr = { version = "0.1.5", features = ["jpeg-max-dimension"] }
zune-jpeg = "0.5.15"
