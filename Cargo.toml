[package]
name = "postframe"
description = "Post-processing built on your JPEGs"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/twangodev/postframe"

[[bin]]
name = "postframe"
required-features = ["cli"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli"]
cli = ["dep:anstream", "dep:anstyle", "dep:anyhow", "dep:clap", "dep:image"]
parallel = ["dep:rayon"]
wasm = [
    "dep:image",
    "dep:lru",
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
]
wasm-threads = ["wasm", "parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
anstream = { version = "1.0.0", optional = true }
anstyle = { version = "1.0.14", optional = true }
anyhow = { version = "1.0.104", optional = true }
bytemuck = "1.25.2"
clap = { version = "4.6.4", features = ["derive"], optional = true }
demosaic = "0.3.0"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
img-parts = "0.4.0"
jpeg-encoder = "0.7.1"
lru = { version = "0.18.0", optional = true }
mtb-align = "0.1.0"
rawler = "0.7.2"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
thiserror = "2.0.19"
ultrahdr-rs = { version = "0.3.5", default-features = false }
wasm-bindgen = { version = "0.2.126", optional = true }
zune-jpeg = "0.5.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.24.0", features = ["js"] }
wasm-bindgen-rayon = { version = "1.3.0", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
