[package]
name = "postframe"
description = "Exposure bracket merging with in-camera rendering recovery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/twangodev/postframe"

[[bin]]
name = "postframe"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.4", features = ["derive"], optional = true }
rawler = "=0.7.2"
